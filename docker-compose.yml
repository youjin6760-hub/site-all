services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: question-review-api:latest
    container_name: question-review-api-server

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      APP_ROOT: /app
      JOBS_DIR: /app/jobs

    volumes:
      - ./backend:/app

    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_QUESTION_API_BASE: http://192.168.219.167:8000
        VITE_REVIEW_API_BASE: http://192.168.219.167:8000

    image: question-review-frontend:latest
    container_name: question-review-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped