services:
  question-review-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: question-review-api:latest
    container_name: question-review-api-server

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ROOT: /app
      JOBS_DIR: /app/jobs

    volumes:
      - .:/app

    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped